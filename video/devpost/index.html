<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGORA+ Devpost</title>
<!--
  Devpost video for AGORA+, built from real captures of the running household Home.
  Creative brief adapted from two prompts in the opus-video-prompts library (MIT):
    @daniel_haida  https://x.com/daniel_haida/status/2104139720829636937  (restrained, premium product film; soundtrack synthesized in code)
    @jhylee95      https://x.com/jhylee95/status/2103604431627452427      (hook in the first second, distinct proof beats, cuts on the beat)
  Every frame is a pure function of time: window.seek(t). Scene cues come from audio/timing.json,
  which snaps each scene to the 96 BPM grid the music is written on.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&display=block" rel="stylesheet" />
<style>
  :root { --paper: #fbf8f1; --ink: #2e2a22; --soft: #6f685a; --butter: #f2cc46; --gold: #b8901a; --coral: #c4553a; }
  html, body { margin: 0; background: var(--paper); overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
    background: radial-gradient(1400px 820px at 50% 40%, #fffdf8 0%, #f8f3e8 55%, #efe7d6 100%);
    font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: var(--ink); }
  #win { position: absolute; left: 0; top: 0; width: 1440px; height: 940px; transform-origin: 0 0; border-radius: 18px; overflow: hidden;
    background: #f4f0e6; box-shadow: 0 60px 120px -44px rgba(80, 62, 22, 0.45), 0 0 0 1px rgba(46, 42, 34, 0.09); will-change: transform, opacity, filter; }
  #chrome { position: absolute; left: 0; top: 0; width: 1440px; height: 40px; background: #fbf8f1; border-bottom: 1px solid rgba(46, 42, 34, 0.08); }
  #chrome i { position: absolute; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: #e3dccb; }
  #chrome b { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); padding: 4px 18px; border-radius: 999px; background: #efe9dc;
    font-size: 14px; font-weight: 600; color: #7d7563; }
  #page { position: absolute; left: 0; top: 40px; width: 1440px; height: 900px; overflow: hidden; }
  #page img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  #phone { position: absolute; left: 0; top: 0; width: 414px; height: 868px; border-radius: 58px; background: #2e2a22; padding: 12px; box-sizing: border-box;
    box-shadow: 0 60px 120px -44px rgba(80, 62, 22, 0.55); will-change: transform, opacity; }
  #phone .screen { position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: #f4f0e6; }
  #phone img { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }
  #titles, #callouts { position: absolute; inset: 0; pointer-events: none; }
  .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .kicker { font-size: 22px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 26px; }
  .line { font-size: 108px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; white-space: nowrap; }
  .line.mid { font-size: 84px; }
  .line.big { font-size: 210px; font-weight: 900; letter-spacing: -0.045em; }
  .line.sub { font-size: 40px; font-weight: 600; color: var(--soft); letter-spacing: -0.01em; margin-top: 26px; }
  .line.foot { font-size: 20px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-top: 36px; }
  .line.hit { color: var(--coral); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.02em 0.1em; margin: -0.04em 0.11em -0.1em; }
  .w > span { display: inline-block; will-change: transform; }
  .plus { color: #e0b52a; }
  .callout { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 26px 16px 18px; border-radius: 999px; background: #fffdf7;
    box-shadow: 0 18px 40px -18px rgba(80, 62, 22, 0.45), 0 0 0 1px rgba(46, 42, 34, 0.08); font-size: 27px; font-weight: 700; white-space: nowrap; will-change: transform, opacity; }
  .callout i { width: 14px; height: 14px; border-radius: 50%; background: var(--butter); box-shadow: 0 0 0 5px #fff1c2; flex: none; }
  .callout.alert i { background: var(--coral); box-shadow: 0 0 0 5px #f6ddd5; }
  .chip { position: absolute; padding: 10px 18px; border-radius: 999px; background: rgba(255, 253, 247, 0.94); box-shadow: 0 0 0 1px rgba(46, 42, 34, 0.1);
    font-size: 19px; font-weight: 700; color: var(--soft); white-space: nowrap; will-change: opacity; }
  #cursor { position: absolute; left: 0; top: 0; width: 38px; height: 38px; will-change: transform, opacity; }
  #scrim { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, rgba(251, 248, 241, 0.97) 0%, rgba(251, 248, 241, 0.9) 30%, rgba(251, 248, 241, 0) 52%); }
  #sources { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; font-size: 19px; font-weight: 600; color: #a39b8a; letter-spacing: 0.02em; opacity: 0; }
  #foot { position: absolute; right: 64px; bottom: 34px; font-size: 16px; font-weight: 600; color: #a39b8a; letter-spacing: 0.01em; }
</style>
</head>
<body>
<div id="stage">
  <div id="win">
    <div id="chrome"><i style="left:18px"></i><i style="left:38px"></i><i style="left:58px"></i><b>AGORA+ Home</b></div>
    <div id="page"><img id="imgA" alt="" /><img id="imgB" alt="" /></div>
  </div>
  <div id="phone"><div class="screen"><img id="phoneImg" alt="" /></div></div>
  <div id="scrim"></div>
  <div id="titles"></div>
  <div id="callouts"></div>
  <div id="sources">Spyglass, Sep 2025 · The Verge, Oct 2026 · Consumer Reports, Dec 2025</div>
  <svg id="cursor" viewBox="0 0 38 38"><path d="M6 3 L6 29 L12.5 23 L17 33 L21.5 31 L17 21.5 L26 21.5 Z" fill="#2e2a22" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" /></svg>
  <div id="foot">Captured from the running app · simulated Alexa+ experience, unofficial</div>
</div>
<script>
(async () => {
  const manifest = await (await fetch('assets/manifest.json')).json();
  const timing = await (await fetch('audio/timing.json')).json();
  const B = manifest.boxes;
  const S = manifest.seqs;
  const file = (name) => `assets/${manifest.shots[name]?.file ?? `${name}.jpg`}`;
  const mid = (b, fx = 0.5, fy = 0.5) => ({ x: b.x + b.width * fx, y: b.y + b.height * fy });

  // ---------- timing ----------
  const T = timing.cues;
  const D = timing.durations;
  window.DURATION = timing.duration;
  window.AUDIO_CUES = T.map((at, i) => ({ file: `audio/s${i + 1}.mp3`, at }));
  window.MUSIC = 'audio/music.wav';
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeInOut = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));

  /** Closed-form spring step: 0 at tau <= 0, settles to 1 with a tiny overshoot. */
  function spring(tau, hz = 0.8, zeta = 0.86) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * hz;
    const wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + (zeta * w / wd) * Math.sin(wd * tau));
  }
  /** A channel that changes target at keyframes; one spring per change, summed. */
  function springTrack(keys, field, hz) {
    return (t) => {
      let v = keys[0][field];
      // A `jump` key is a hard cut: the camera is already there when the new shot appears.
      for (let i = 1; i < keys.length; i++) v += (keys[i][field] - keys[i - 1][field]) * (keys[i].jump ? (t >= keys[i].t ? 1 : 0) : spring(t - keys[i].t, hz));
      return v;
    };
  }

  // ---------- places on the captured page (CSS px of the 1440x900 viewport) ----------
  const input = mid(B['idle-input'], 0.35);
  const caption = { x: 400, y: 495 };
  const receipt = mid(B.receipt, 1, 0.5);
  const shopping = mid(B['shop-shopping']);
  const milk = mid(B.milk);
  const basket = { x: B.basket.x + 60, y: B.basket.y + B.basket.height / 2 };
  const approvalCard = mid(B.approvalCard);
  const approve = mid(B.approve);
  const plans = mid(B['plans-done']);
  const readPlan = mid(B.readPlan);
  const traceFast = mid(B['trace-fast']);
  const FULL = { cx: 720, cy: 450, z: 0.94 };
  const TYPING = { cx: 470, cy: 480, z: 1.5 };
  const CAPTION = { cx: 410, cy: 500, z: 1.75 };

  // ---------- what the window shows ----------
  const shots = [];
  const show = (t, name, cut = true) => shots.push({ t, src: file(name), cut });
  const seq = (name, t0, t1, from = 0, to) => {
    const frames = S[name] ?? [];
    const last = to ?? frames.length - 1;
    const count = last - from;
    for (let i = from; i <= last; i++) {
      const p = count > 0 ? (i - from) / count : 0;
      shots.push({ t: t0 + (t1 - t0) * p, src: `assets/${frames[i].file}`, cut: true });
    }
  };
  /** A scroll sequence on an eased clock, so the page glides like a trackpad scroll. */
  const glide = (name, t0, t1) => {
    const frames = S[name] ?? [];
    const n = frames.length - 1;
    for (let i = 0; i <= n; i++) {
      // invert the ease so frame i lands where an eased scroll would be
      let lo = 0, hi = 1;
      for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (easeInOut(m) < i / n) lo = m; else hi = m; }
      shots.push({ t: t0 + (t1 - t0) * lo, src: `assets/${frames[i].file}`, cut: true });
    }
  };

  show(0, 'home-idle');
  // S2 intro: the page, then a scroll through it
  show(T[1] + 2.8, 'home-idle');
  glide('tour', T[1] + 4.7, T[1] + 8.6);
  // S3 memory
  show(T[2] + 1.0, 'home-idle');
  seq('remember-type', T[2] + 1.7, T[2] + 3.2);
  show(T[2] + 3.3, 'remember-after-0');
  show(T[2] + 3.8, 'remember-after-1', false);
  show(T[2] + 4.6, 'remember-after-2', false);
  show(T[2] + 5.5, 'remember-after-3', false);
  show(T[2] + 6.2, 'remember-done', false);
  glide('family', T[2] + 7.3, T[2] + 8.7);
  show(T[2] + 8.75, 'family-allergy');
  // S4 recall, with the trace open
  seq('recall-type', T[3] + 1.4, T[3] + 2.6);
  show(T[3] + 2.7, 'recall-after-0');
  show(T[3] + 3.1, 'recall-after-1', false);
  show(T[3] + 3.9, 'recall-after-2', false);
  show(T[3] + 4.7, 'recall-after-3', false);
  show(T[3] + 5.4, 'recall-hood', false);
  // S5 lists
  seq('shopping-type', T[4] + 1.35, T[4] + 2.35);
  show(T[4] + 2.4, 'shopping-after-0');
  show(T[4] + 2.85, 'shopping-after-1', false);
  show(T[4] + 3.4, 'shopping-after-2', false);
  show(T[4] + 3.95, 'shopping-done', false);
  show(T[4] + 5.45, 'milk-ticked-0');
  show(T[4] + 6.1, 'milk-ticked-1', false);
  show(T[4] + 7.0, 'basket-open');
  // S6 briefing
  seq('briefing-type', T[5] + 1.35, T[5] + 2.05);
  show(T[5] + 2.1, 'briefing-after-0');
  show(T[5] + 2.55, 'briefing-after-1', false);
  show(T[5] + 3.2, 'briefing-after-2', false);
  show(T[5] + 4.0, 'briefing-after-3', false);
  // S7 approval
  seq('plan-type', T[6] + 1.35, T[6] + 2.35);
  show(T[6] + 2.4, 'plan-after-0');
  show(T[6] + 2.8, 'plan-after-1', false);
  show(T[6] + 3.25, 'plan-after-2', false);
  show(T[6] + 3.7, 'plan-approval', false);
  show(T[6] + 6.7, 'plan-approved-0');
  show(T[6] + 7.5, 'plan-approved-1', false);
  // S8 team: the first steps sped up, then the finished plan
  const TEAM_END = Math.min(S.team.length - 1, S.team.findIndex((f) => (f.tasks ?? []).length >= 4 && f.tasks.every((x) => x.endsWith(':done'))) + 2);
  seq('team', T[7] + 1.0, T[7] + 6.4, 0, TEAM_END);
  show(T[7] + 6.6, 'plan-done');
  show(T[7] + 11.55, 'plan-sheet');
  show(T[7] + 13.1, 'plan-sheet-2', false);
  // S9 under the hood, then Connect
  show(T[8] + 1.0, 'hood');
  show(T[8] + 5.0, 'connect');
  // S10 the finished page
  show(T[9] + 0.0, 'home-final');
  shots.sort((a, b) => a.t - b.t);

  // ---------- camera ----------
  const cam = [
    { t: 0, ...FULL },
    { t: T[1] + 2.8, ...FULL, z: 0.9 },
    { t: T[1] + 4.6, ...FULL, z: 0.96 },
    { t: T[2] + 1.0, ...TYPING },
    { t: T[2] + 3.6, ...CAPTION },
    { t: T[2] + 7.2, cx: 1000, cy: 430, z: 1.25 },
    { t: T[2] + 8.6, cx: 1110, cy: 400, z: 1.6 },
    { t: T[3] + 0.95, ...TYPING },
    { t: T[3] + 3.1, ...CAPTION },
    { t: T[3] + 5.3, cx: Math.min(1120, traceFast.x + 80), cy: traceFast.y + 50, z: 1.7 },
    { t: T[4] + 0.95, ...TYPING },
    { t: T[4] + 3.0, cx: shopping.x - 40, cy: shopping.y, z: 1.7 },
    { t: T[4] + 7.6, cx: 690, cy: 420, z: 1.4 },
    { t: T[5] + 0.95, ...TYPING },
    { t: T[5] + 2.6, ...CAPTION },
    { t: T[5] + 4.9, cx: 560, cy: 175, z: 1.75 },
    { t: T[6] + 0.95, ...TYPING },
    { t: T[6] + 3.9, cx: approvalCard.x + 130, cy: approvalCard.y - 10, z: 1.75 },
    { t: T[7] + 0.95, cx: 1030, cy: 400, z: 1.5 },
    { t: T[7] + 6.8, cx: plans.x - 70, cy: plans.y - 40, z: 1.95 },
    { t: T[7] + 10.4, cx: plans.x - 40, cy: plans.y + 40, z: 1.6 },
    // Cut straight to the readable part of the plan (the model's first draft line above it is garbled).
    { t: T[7] + 11.55, cx: 1070, cy: 640, z: 1.5, jump: true },
    { t: T[8] + 0.95, cx: 1060, cy: 430, z: 1.35 },
    { t: T[8] + 5.0, cx: 1080, cy: 300, z: 1.6 },
    { t: T[9] - 0.05, cx: 1180, cy: 470, z: 0.78 },
  ];
  const camX = springTrack(cam, 'cx', 0.7);
  const camY = springTrack(cam, 'cy', 0.7);
  const camZ = springTrack(cam, 'z', 0.7);

  // ---------- window on screen ----------
  const winOn = [[T[1] + 2.8, T[2]], [T[2] + 1.0, T[3]], [T[3] + 0.95, T[4]], [T[4] + 0.95, T[5]], [T[5] + 0.95, T[6]], [T[6] + 0.95, T[7]], [T[7] + 0.95, T[8]], [T[8] + 0.95, T[9] + 3.4]];
  function winAlpha(t) {
    for (const [a, b] of winOn) {
      if (t >= a - 0.01 && t <= b + 0.01) return Math.min(ease(seg(t, a, a + 0.45)), 1 - ease(seg(t, b - 0.35, b)));
    }
    return 0;
  }

  // ---------- cursor ----------
  const cursorKeys = [
    { t: 0, x: 900, y: 760 },
    { t: T[2] + 1.15, x: 900, y: 760 }, { t: T[2] + 1.25, x: input.x + 30, y: input.y + 6 },
    { t: T[4] + 4.4, x: input.x + 30, y: input.y + 6 }, { t: T[4] + 4.5, x: milk.x + 120, y: milk.y + 90 }, { t: T[4] + 4.7, x: milk.x, y: milk.y + 2 },
    { t: T[4] + 6.2, x: basket.x, y: basket.y + 3 },
    { t: T[6] + 5.2, x: approvalCard.x + 220, y: approvalCard.y + 140 }, { t: T[6] + 5.6, x: approve.x, y: approve.y + 3 },
    { t: T[7] + 10.3, x: readPlan.x + 160, y: readPlan.y + 120 }, { t: T[7] + 10.5, x: readPlan.x, y: readPlan.y + 3 },
  ];
  const curX = springTrack(cursorKeys, 'x', 1.1);
  const curY = springTrack(cursorKeys, 'y', 1.1);
  const cursorOn = [[T[2] + 1.2, T[2] + 3.5], [T[3] + 1.05, T[3] + 1.45], [T[4] + 1.05, T[4] + 1.4], [T[4] + 4.5, T[4] + 7.3], [T[5] + 1.05, T[5] + 1.4], [T[6] + 1.05, T[6] + 1.4], [T[6] + 5.1, T[6] + 7.2], [T[7] + 10.2, T[7] + 11.8]];
  const clicks = [T[2] + 1.5, T[3] + 1.25, T[4] + 1.2, T[4] + 5.35, T[4] + 6.85, T[5] + 1.2, T[6] + 1.2, T[6] + 6.6, T[7] + 11.4];

  // ---------- titles: words rise on the phrase they are spoken with ----------
  const P = (i, rel) => T[i] + rel;
  const titles = [
    { t0: P(0, 0.12), t1: P(0, 3.35), lines: [{ text: 'Voice assistants', cls: 'mid' }, { text: 'were supposed to run the house', cls: 'mid', at: P(0, 0.9) }] },
    { t0: P(0, 3.6), t1: T[1] - 0.25, lines: [
      { text: 'Simple commands lag.', cls: 'mid', at: P(0, 3.65) },
      { text: 'Big jobs stall halfway.', cls: 'mid', at: P(0, 5.3) },
      { text: 'It forgets what you said.', cls: 'mid hit', at: P(0, 7.25) },
    ] },
    { t0: P(1, 0.1), t1: P(1, 2.75), lines: [{ text: 'AGORA+', cls: 'big' }, { text: 'Your household assistant, upgraded', cls: 'sub', at: P(1, 0.7) }] },
    { t0: T[2] + 0.05, t1: T[2] + 1.2, kicker: '01 · Memory', lines: [{ text: 'Tell it once' }] },
    { t0: T[3] + 0.05, t1: T[3] + 1.15, kicker: '02 · Recall', lines: [{ text: 'Answers from memory' }] },
    { t0: T[4] + 0.05, t1: T[4] + 1.15, kicker: '03 · Lists', lines: [{ text: 'One page for the house' }] },
    { t0: T[5] + 0.05, t1: T[5] + 1.15, kicker: '04 · Briefing', lines: [{ text: 'What matters, first' }] },
    { t0: T[6] + 0.05, t1: T[6] + 1.15, kicker: '05 · Approval', lines: [{ text: 'It asks first' }] },
    { t0: T[7] + 0.05, t1: T[7] + 1.15, kicker: '06 · Team', lines: [{ text: 'A team, not a chatbot' }] },
    { t0: T[8] + 0.05, t1: T[8] + 1.15, kicker: '07 · Open standard', lines: [{ text: 'One brain, every surface' }] },
    { t0: P(9, 3.55), t1: 999, lines: [
      { text: 'AGORA+', cls: 'big' },
      { text: 'Remembers · Asks first · Shows its work', cls: 'sub', words: [P(9, 3.9), P(9, 4.95), P(9, 4.95), P(9, 5.01), P(9, 6.35), P(9, 6.35), P(9, 6.41), P(9, 6.47)] },
      { text: 'Open source · MIT · Amazon Developer Hackathon 2026', cls: 'foot', at: P(9, 7.4) },
    ] },
  ];
  const titleRoot = document.getElementById('titles');
  for (const title of titles) {
    const el = document.createElement('div');
    el.className = 'title';
    title.starts = [];
    if (title.kicker) {
      const k = document.createElement('div');
      k.className = 'kicker';
      k.innerHTML = `<span class="w"><span>${title.kicker}</span></span>`;
      el.appendChild(k);
      title.starts.push(title.t0);
    }
    for (const line of title.lines) {
      const l = document.createElement('div');
      l.className = `line ${line.cls ?? ''}`;
      const words = line.text.split(' ');
      l.innerHTML = words.map((word) => `<span class="w"><span>${word === 'AGORA+' ? 'AGORA<span class="plus">+</span>' : word}</span></span>`).join('');
      el.appendChild(l);
      words.forEach((_, j) => title.starts.push(line.words?.[j] ?? (line.at ?? title.t0) + j * 0.06));
    }
    titleRoot.appendChild(el);
    title.el = el;
    title.words = [...el.querySelectorAll('.w > span')];
  }

  // ---------- callouts and chips ----------
  const callouts = [
    { t0: P(1, 3.4), t1: P(1, 7.2), text: 'Runs on your own server', screen: { x: 120, y: 968 } },
    { t0: T[2] + 4.4, t1: T[2] + 7.0, text: 'Verified = read back from disk', at: receipt, dx: 34, dy: -30 },
    { t0: T[2] + 8.9, t1: T[3] - 0.3, text: 'Every plan is checked against this', screen: { x: 1200, y: 662 } },
    { t0: T[3] + 5.7, t1: T[4] - 0.3, text: 'No model call', at: traceFast, dx: -640, dy: -10 },
    { t0: T[6] + 6.9, t1: T[7] - 0.35, text: 'Only a person can approve', screen: { x: 1010, y: 200 } },
    { t0: T[7] + 8.8, t1: T[7] + 11.2, text: "Keeper flagged Mia's allergy", screen: { x: 150, y: 440 }, alert: true },
    { t0: T[8] + 1.7, t1: T[9] - 0.3, text: 'Real MCP tool calls · Streamable HTTP', screen: { x: 110, y: 400 } },
    { t0: T[8] + 3.1, t1: T[9] - 0.3, text: 'OAuth account linking with PKCE', screen: { x: 110, y: 500 } },
    { t0: T[8] + 7.0, t1: T[9] - 0.3, text: 'Packaged as an Alexa+ add-on', screen: { x: 110, y: 600 } },
  ];
  const chips = [
    { t0: T[7] + 1.2, t1: T[7] + 6.5, text: 'Live run · sped up', screen: { x: 120, y: 918 } },
    { t0: T[7] + 6.7, t1: T[7] + 11.3, text: `Finished in ${Math.round(((S.team.at(-1)?.at ?? 136)))} s`, screen: { x: 120, y: 918 } },
    { t0: T[7] + 1.2, t1: T[8] - 0.3, text: 'Plans by Qwen 2.5 32B, an open model, via Featherless', screen: { x: 120, y: 980 } },
  ];
  const calloutRoot = document.getElementById('callouts');
  for (const c of callouts) {
    const el = document.createElement('div');
    el.className = `callout${c.alert ? ' alert' : ''}`;
    el.innerHTML = `<i></i><span>${c.text}</span>`;
    calloutRoot.appendChild(el);
    c.el = el;
  }
  for (const c of chips) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = c.text;
    calloutRoot.appendChild(el);
    c.el = el;
  }

  // ---------- frame ----------
  const win = document.getElementById('win');
  const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const phone = document.getElementById('phone');
  const phoneImg = document.getElementById('phoneImg');
  const cursor = document.getElementById('cursor');
  const decoded = new Set();
  async function setImg(img, src) {
    if (img.dataset.src !== src) {
      img.dataset.src = src;
      img.src = src;
    }
    if (!decoded.has(src)) {
      try { await img.decode(); decoded.add(src); } catch { /* the next frame retries */ }
    }
  }
  function currentShot(t) {
    let i = 0;
    for (let k = 0; k < shots.length; k++) if (shots[k].t <= t) i = k;
    const cur = shots[i];
    const prev = shots[Math.max(0, i - 1)];
    return { cur: cur.src, prev: prev.src, alpha: cur.cut ? 1 : ease(seg(t, cur.t, cur.t + 0.22)) };
  }
  function wordState(title, t) {
    const n = title.words.length;
    title.words.forEach((w, i) => {
      const inP = spring(t - title.starts[i], 1.3, 0.9);
      const outP = ease(seg(t, title.t1 - 0.38 + i * 0.02, title.t1 - 0.06 + i * 0.02));
      w.style.transform = `translateY(${(1 - inP) * 112 - outP * 112}%)`;
    });
    title.el.style.display = t >= title.t0 - 0.05 && t <= title.t1 + 0.1 ? 'flex' : 'none';
    return n;
  }
  const PHONE_IN = T[9] + 0.2;
  const PHONE_OUT = T[9] + 3.4;

  window.seek = async (t) => {
    const z = camZ(t);
    const cx = camX(t);
    const cy = camY(t);
    const toScreen = (p) => ({ x: 960 + (p.x - cx) * z, y: 540 + (p.y + 40 - (cy + 40)) * z });

    const a = winAlpha(t);
    const settle = 1 - a;
    win.style.transform = `translate(${960 - cx * z}px, ${540 - (cy + 40) * z + settle * 26}px) scale(${z * (1 - settle * 0.025)})`;
    win.style.opacity = String(a);
    win.style.filter = settle > 0.01 ? `blur(${(settle * 9).toFixed(2)}px)` : 'none';
    win.style.display = a > 0.002 ? 'block' : 'none';
    const work = [];
    if (a > 0.002) {
      const s = currentShot(t);
      work.push(setImg(imgA, s.prev), setImg(imgB, s.cur));
      imgB.style.opacity = String(s.alpha);
    }

    // The phone slides in beside the page at the close, scrolling the same Home.
    const pin = spring(t - PHONE_IN, 0.9, 0.85);
    const pout = ease(seg(t, PHONE_OUT - 0.35, PHONE_OUT));
    const palpha = clamp01(pin) * (1 - pout);
    phone.style.display = palpha > 0.003 ? 'block' : 'none';
    if (palpha > 0.003) {
      phone.style.opacity = String(palpha);
      phone.style.transform = `translate(${1360 + (1 - pin) * 220}px, ${106 + pout * 20}px) scale(0.98)`;
      const frames = S.phone;
      const p = easeInOut(seg(t, PHONE_IN + 0.5, PHONE_OUT - 0.3));
      const f = frames[Math.round(p * (frames.length - 1))];
      work.push(setImg(phoneImg, `assets/${f.file}`));
    }

    for (const title of titles) wordState(title, t);
    const scrim = Math.min(ease(seg(t, T[8] + 1.1, T[8] + 1.8)), 1 - ease(seg(t, T[9] - 0.5, T[9])));
    document.getElementById('scrim').style.opacity = String(Math.max(0, scrim));
    document.getElementById('sources').style.opacity = String(Math.min(ease(seg(t, P(0, 3.7), P(0, 4.3))), 1 - ease(seg(t, T[1] - 0.6, T[1] - 0.2))));

    for (const c of callouts) {
      const p = spring(t - c.t0, 1.2, 0.9);
      const alpha = clamp01(p) * (1 - ease(seg(t, c.t1 - 0.35, c.t1)));
      c.el.style.display = alpha > 0.003 ? 'flex' : 'none';
      if (alpha <= 0.003) continue;
      const pos = c.screen ?? (() => { const sp = toScreen(c.at); return { x: sp.x + (c.dx ?? 0), y: sp.y + (c.dy ?? 0) }; })();
      c.el.style.opacity = String(alpha);
      c.el.style.transform = `translate(${pos.x}px, ${pos.y + (1 - p) * 18}px)`;
    }
    for (const c of chips) {
      const alpha = Math.min(ease(seg(t, c.t0, c.t0 + 0.3)), 1 - ease(seg(t, c.t1 - 0.3, c.t1)));
      c.el.style.display = alpha > 0.003 ? 'block' : 'none';
      c.el.style.opacity = String(alpha);
      c.el.style.transform = `translate(${c.screen.x}px, ${c.screen.y}px)`;
    }

    let cursorAlpha = 0;
    for (const [c0, c1] of cursorOn) if (t >= c0 && t <= c1) cursorAlpha = Math.min(ease(seg(t, c0, c0 + 0.2)), 1 - ease(seg(t, c1 - 0.2, c1)));
    cursorAlpha *= a;
    if (cursorAlpha > 0.003) {
      const p = toScreen({ x: curX(t), y: curY(t) });
      let press = 1;
      for (const k of clicks) press = Math.min(press, 1 - 0.16 * Math.sin(Math.PI * seg(t, k - 0.06, k + 0.16)));
      cursor.style.display = 'block';
      cursor.style.opacity = String(cursorAlpha);
      cursor.style.transform = `translate(${p.x - 6}px, ${p.y - 3}px) scale(${press})`;
    } else cursor.style.display = 'none';

    await Promise.all(work);
  };

  await document.fonts.ready;
  const params = new URLSearchParams(location.search);
  if (!params.has('render')) {
    const stage = document.getElementById('stage');
    const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
    addEventListener('resize', fit);
    fit();
    const audio = window.AUDIO_CUES.map((c) => Object.assign(new Audio(c.file), { _at: c.at }));
    const music = new Audio(window.MUSIC);
    music.volume = 0.4;
    const start = performance.now() - (Number(params.get('t')) || 0) * 1000;
    let busy = false;
    let musicOn = false;
    const loop = async () => {
      const t = (performance.now() - start) / 1000;
      if (!busy) { busy = true; await window.seek(Math.min(t, window.DURATION)); busy = false; }
      if (!musicOn) { musicOn = true; music.currentTime = t; music.play().catch(() => {}); }
      for (const clip of audio) if (!clip._played && t >= clip._at) { clip._played = true; clip.play().catch(() => {}); }
      if (t < window.DURATION) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  await window.seek(0);
  window.ready = true;
})();
</script>
</body>
</html>
