<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGORA+ motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@500;600&display=block" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
  </script>
  <style>
    :root { --paper: #fbf8f1; --ink: #2e2a22; --soft: #6f685a; --butter: #f2cc46; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: var(--ink); }
    #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
    canvas { display: block; }
    .overlay { position: absolute; inset: 0; pointer-events: none; }
    #caption { position: absolute; left: 120px; bottom: 104px; max-width: 900px; will-change: transform, opacity; }
    #kicker { font-size: 22px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #b8901a; }
    #headline { margin-top: 14px; font-size: 64px; line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; }
    #sub { margin-top: 18px; font-size: 27px; line-height: 1.4; font-weight: 500; color: var(--soft); max-width: 820px; }
    #mark { position: absolute; left: 120px; top: 84px; display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 26px; letter-spacing: 0.02em; }
    #mark i { width: 22px; height: 22px; border-radius: 50%; background: var(--butter); box-shadow: inset 0 0 0 5px #fff6d6; display: inline-block; }
    #progress { position: absolute; right: 120px; top: 92px; display: flex; gap: 10px; }
    #progress b { width: 34px; height: 6px; border-radius: 6px; background: #e8e0cf; overflow: hidden; position: relative; }
    #progress b span { position: absolute; inset: 0; width: 0; background: var(--butter); }
    #note { position: absolute; right: 120px; bottom: 60px; font-size: 16px; color: #a39b8a; font-weight: 500; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div class="overlay">
      <div id="mark"><i></i>AGORA+</div>
      <div id="progress"></div>
      <div id="caption"><div id="kicker"></div><div id="headline"></div><div id="sub"></div></div>
      <div id="note">Simulated Alexa+ experience · unofficial</div>
    </div>
  </div>
  <script type="module" src="./motion.js"></script>
</body>
</html>
